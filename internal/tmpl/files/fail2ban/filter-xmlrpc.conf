# fail2ban filter: XML-RPC abuse.
#
# xmlrpc.php supports batched authentication attempts, so a single request can
# carry hundreds of password guesses. The threshold on this jail is
# correspondingly low.

[Definition]
failregex = ^<HOST> .* "POST /xmlrpc\.php.*" \d+
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
