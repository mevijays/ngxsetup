# fail2ban filter: vulnerability scanners.
#
# Matches requests for paths that no legitimate visitor to a WordPress site
# ever asks for. Each of these is a signature of an automated sweep looking for
# an exposed database console, a leaked environment file, or a backup archive.

[Definition]
failregex = ^<HOST> .* "(?:GET|POST|HEAD) /(?:phpmyadmin|phpMyAdmin|pma|myadmin|mysql|dbadmin|adminer(?:\.php)?|\.env|\.git/|wp-config\.php\.(?:bak|old|save|txt)|backup\.(?:sql|zip|tar\.gz)|shell\.php|wso\.php|alfa\.php|\.aws/|config\.json)[^"]*" \d+
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
