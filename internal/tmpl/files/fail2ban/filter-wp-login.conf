# fail2ban filter: repeated POSTs to the WordPress login form.
#
# Only POST is matched. A GET of wp-login.php is somebody opening the login
# page, which is not evidence of anything.

[Definition]
failregex = ^<HOST> .* "POST /wp-login\.php.*" (?:200|302|401|403)
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
