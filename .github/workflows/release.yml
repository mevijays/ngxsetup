name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath \
                -ldflags "-s -w -X ngxsetup/internal/build.Version=${version}" \
                -o "dist/ngxsetup-linux-${arch}" ./cmd/ngxsetup
          done

      - name: Checksums
        run: cd dist && sha256sum ngxsetup-* > SHA256SUMS

      # v1.0.0-beta, v1.2.0-rc1, etc. publish as a GitHub pre-release —
      # anything with a hyphen after the version core is, by semver
      # convention, a pre-release build. A plain vX.Y.Z is a full release.
      - name: Determine prerelease flag
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: |
            dist/ngxsetup-linux-amd64
            dist/ngxsetup-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
