name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/ngxsetup
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/ngxsetup

  integration:
    name: End-to-end on a real stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o ngxsetup ./cmd/ngxsetup

      # The unit tests verify that templates render; only a real nginx, PHP-FPM
      # and MariaDB can verify that what they render is actually valid. This is
      # the check that catches a directive that does not exist, an option a
      # given flavour rejects, and an include path that does not resolve.
      - name: Install the stack
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php-fpm php-mysql php-xml php-curl php-gd php-mbstring \
            php-zip php-intl php-bcmath php-apcu mariadb-server certbot

      - name: Apply configuration
        run: sudo ./ngxsetup setup --skip-packages --verbose

      - name: nginx accepts the generated configuration
        run: sudo nginx -t

      # There is deliberately no "php-fpm -t" step here against the
      # distribution's shared php-fpm.conf: setup disables that service and
      # it owns no pools by design (every site gets its own isolated
      # instance and pool under /etc/ngxsetup/fpm — see ApplyPHP's and
      # ValidatePHP's doc comments). Testing the distro's config would just
      # confirm it is empty. What has to be confirmed instead is that the
      # shared service is correctly left disabled, and per-site config
      # validity is exercised for real once a site exists, a few steps down.
      - name: distribution php-fpm service is correctly disabled
        run: |
          version=$(php -r "echo PHP_MAJOR_VERSION.'.'.PHP_MINOR_VERSION;")
          unit="php${version}-fpm.service"
          systemctl list-unit-files --no-legend "$unit" | grep -q "$unit" \
            || { echo "expected $unit to exist as a unit"; exit 1; }
          systemctl is-enabled "$unit" >/dev/null 2>&1 \
            && { echo "$unit should be disabled"; exit 1; }
          systemctl is-active "$unit" >/dev/null 2>&1 \
            && { echo "$unit should not be running"; exit 1; }
          echo "$unit is correctly disabled and inactive"

      - name: MariaDB started with the generated configuration
        run: |
          sudo systemctl is-active mariadb
          # Confirm the tuned values actually took effect rather than being
          # written to a file the server never read.
          sudo mariadb -e "SELECT @@innodb_buffer_pool_size, @@max_connections, @@innodb_flush_log_at_trx_commit;"

      - name: Create a site
        run: |
          sudo ./ngxsetup site add ci-test.example.com --wordpress --self-signed --verbose
          sudo nginx -t
          sudo ./ngxsetup site list

      - name: The site serves WordPress
        run: |
          # Resolve the test domain locally and confirm nginx routes to the
          # right pool and PHP executes.
          echo "127.0.0.1 ci-test.example.com" | sudo tee -a /etc/hosts
          sudo systemctl restart nginx
          status=$(curl -sk -o /dev/null -w '%{http_code}' https://ci-test.example.com/)
          echo "HTTP $status"
          # WordPress redirects to its installer, so anything in the 2xx/3xx
          # range means PHP ran and the pool socket was reachable.
          case "$status" in 2*|3*) ;; *) echo "unexpected status"; exit 1 ;; esac

      - name: Site isolation is real
        run: |
          # The pool must run as the site's own user, not www-data. ps's
          # default "user" column is 8 characters wide and silently
          # truncates ("web-ci-+"), which would falsely fail this check
          # against a real, correctly-scoped username — hence user:32.
          sudo ps -eo user:32,args | grep '[p]hp-fpm: pool ci-test' | head -1
          sudo ps -eo user:32,args | grep '[p]hp-fpm: pool ci-test' | grep -q '^web-ci-test' \
            || { echo "pool is not running as the site user"; exit 1; }
          # wp-config.php must not be world-readable.
          perms=$(sudo stat -c '%a' /var/www/ci-test-example-com/public/wp-config.php)
          echo "wp-config.php mode: $perms"
          [ "$((0$perms & 0004))" -eq 0 ] || { echo "wp-config.php is world-readable"; exit 1; }

      - name: phpMyAdmin serves, not a 500, and is actually behind its credential
        run: |
          sudo ./ngxsetup config set phpmyadmin.allow_list 127.0.0.1/32
          sudo ./ngxsetup config set phpmyadmin.enabled true
          echo "ci-test-password-1234" | sudo ./ngxsetup secure --phpmyadmin-user ci-admin
          sudo ./ngxsetup secure --apply
          sudo ./ngxsetup tune --apply >/dev/null
          # No credentials: must be a clean 401 (the app is reachable and the
          # auth gate itself works), never a 500 — a 500 here is exactly the
          # real bug this step exists to catch: nginx's worker (www-data)
          # unable to even open the htpasswd file to check the credential.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9443/)
          echo "no credentials: HTTP $code"
          [ "$code" = "401" ] || { echo "expected 401, got $code"; sudo tail -20 /var/log/nginx/phpmyadmin.error.log; exit 1; }
          # Wrong credentials: still 401, not 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' -u ci-admin:wrong-password http://127.0.0.1:9443/)
          echo "wrong password: HTTP $code"
          [ "$code" = "401" ] || { echo "expected 401, got $code"; sudo tail -20 /var/log/nginx/phpmyadmin.error.log; exit 1; }
          # Correct credentials: past the HTTP auth gate entirely (the app
          # itself may still show its own login form — 200 either way).
          code=$(curl -s -o /dev/null -w '%{http_code}' -u ci-admin:ci-test-password-1234 http://127.0.0.1:9443/)
          echo "correct password: HTTP $code"
          [ "$code" = "200" ] || { echo "expected 200, got $code"; sudo tail -20 /var/log/nginx/phpmyadmin.error.log; exit 1; }
          # A real phpMyAdmin page load fires two dozen-plus concurrent asset
          # requests — regression test for a real bug where the vhost used
          # the login rate-limit zone (rate per *minute*, burst 5) instead of
          # the general one, 429ing a legitimate, already-authenticated
          # visitor on their very first page load.
          seq 1 30 | xargs -P 30 -I{} curl -s -o /dev/null -w '%{http_code}\n' \
            -u ci-admin:ci-test-password-1234 "http://127.0.0.1:9443/index.php?burst={}" \
            > /tmp/pma-burst-codes.txt
          if grep -q 429 /tmp/pma-burst-codes.txt; then
            echo "a burst of 30 concurrent asset-sized requests hit HTTP 429 — the rate limit is too tight for a real page load"
            sort /tmp/pma-burst-codes.txt | uniq -c
            exit 1
          fi

      - name: Applying twice changes nothing
        run: |
          # A fair idempotency check compares two applies run back-to-back,
          # not one against whatever `setup` produced minutes ago: real
          # state has legitimately moved since then (a site now exists,
          # which correctly changes opcache sizing; disk usage has shifted
          # from installing WordPress). Establish the current baseline with
          # one apply first, discard its output, then check that an
          # immediately-following second apply reports nothing further.
          sudo ./ngxsetup tune --apply > /tmp/baseline-apply.log 2>&1
          cat /tmp/baseline-apply.log
          sudo ./ngxsetup tune --apply > /tmp/second-apply.log 2>&1
          cat /tmp/second-apply.log
          if grep -qE '^\s*(✓|created|updated)' /tmp/second-apply.log; then
            echo "second apply reported changes; the configuration is not idempotent"
            exit 1
          fi

      - name: Remove the site cleanly
        run: |
          sudo ./ngxsetup site remove ci-test.example.com --purge-files --purge-db --yes
          sudo nginx -t
          # The pool, the vhost and the database user must all be gone.
          ! sudo test -e /etc/nginx/sites-enabled/ci-test-example-com.conf
          ! sudo mariadb -e "SELECT 1" ci_test_example_com 2>/dev/null

      - name: Diagnostics
        run: sudo ./ngxsetup doctor || true
